<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-label="Saga compensation path: PaymentFailed triggers StockReleaseRequested and OrderCancelled in parallel">
  <title>Saga compensation path</title>
  <desc>OrderCreated → StockReserveRequested → StockReserved → PaymentRequested → PaymentFailed → StockReleaseRequested + OrderCancelled (parallel)</desc>
  <defs>
    <marker id="arrow-comp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-comp-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
    <style>
      .bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .box { fill: #0e1116; stroke-width: 1.5; }
      .box-warn { stroke: #d29922; }
      .box-accent { stroke: #4493f8; }
      .box-bad { stroke: #f85149; }
      .lbl-warn { fill: #d29922; font-family: ui-monospace, "Cascadia Code", monospace; font-size: 11px; font-weight: 600; }
      .lbl-accent { fill: #4493f8; font-family: ui-monospace, "Cascadia Code", monospace; font-size: 11px; font-weight: 600; }
      .lbl-bad { fill: #f85149; font-family: ui-monospace, "Cascadia Code", monospace; font-size: 11px; font-weight: 600; }
      .arrow { stroke: #7d8590; stroke-width: 1.5; fill: none; }
      .arrow-bad { stroke: #f85149; stroke-width: 1.5; fill: none; }
      .title { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .lbl-muted { fill: #7d8590; font-family: ui-monospace, "Cascadia Code", monospace; font-size: 10px; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="280" rx="6"/>
  <text class="title" x="16" y="22">Saga — compensation path</text>

  <g>
    <rect class="box box-warn" x="30" y="42" width="140" height="56" rx="6"/>
    <text class="lbl-warn" x="100" y="66" text-anchor="middle">OrderCreated</text>
    <text class="lbl-warn" x="100" y="82" text-anchor="middle" opacity="0.7">start</text>
  </g>

  <g>
    <rect class="box box-warn" x="190" y="42" width="140" height="56" rx="6"/>
    <text class="lbl-warn" x="260" y="64" text-anchor="middle">StockReserve</text>
    <text class="lbl-warn" x="260" y="80" text-anchor="middle">Requested</text>
  </g>

  <g>
    <rect class="box box-accent" x="350" y="42" width="140" height="56" rx="6"/>
    <text class="lbl-accent" x="420" y="66" text-anchor="middle">StockReserved</text>
    <text class="lbl-accent" x="420" y="82" text-anchor="middle" opacity="0.7">ok</text>
  </g>

  <g>
    <rect class="box box-warn" x="510" y="42" width="140" height="56" rx="6"/>
    <text class="lbl-warn" x="580" y="66" text-anchor="middle">PaymentRequested</text>
  </g>

  <g>
    <rect class="box box-bad" x="670" y="42" width="140" height="56" rx="6"/>
    <text class="lbl-bad" x="740" y="66" text-anchor="middle">PaymentFailed</text>
    <text class="lbl-bad" x="740" y="82" text-anchor="middle" opacity="0.7">compensate</text>
  </g>

  <line class="arrow" x1="170" y1="70" x2="190" y2="70" marker-end="url(#arrow-comp-mut)"/>
  <line class="arrow" x1="330" y1="70" x2="350" y2="70" marker-end="url(#arrow-comp-mut)"/>
  <line class="arrow" x1="490" y1="70" x2="510" y2="70" marker-end="url(#arrow-comp-mut)"/>
  <line class="arrow" x1="650" y1="70" x2="670" y2="70" marker-end="url(#arrow-comp-mut)"/>

  <line class="arrow-bad" x1="740" y1="98" x2="740" y2="130"/>
  <path class="arrow-bad" d="M 740 130 L 470 130 L 470 184" marker-end="url(#arrow-comp)"/>
  <path class="arrow-bad" d="M 740 130 L 670 130 L 670 184" marker-end="url(#arrow-comp)"/>

  <g>
    <rect class="box box-warn" x="400" y="184" width="140" height="56" rx="6"/>
    <text class="lbl-warn" x="470" y="206" text-anchor="middle">StockRelease</text>
    <text class="lbl-warn" x="470" y="222" text-anchor="middle">Requested</text>
  </g>

  <g>
    <rect class="box box-bad" x="600" y="184" width="140" height="56" rx="6"/>
    <text class="lbl-bad" x="670" y="206" text-anchor="middle">OrderCancelled</text>
    <text class="lbl-bad" x="670" y="222" text-anchor="middle" opacity="0.7">terminal</text>
  </g>

  <text class="lbl-muted" x="755" y="124" text-anchor="start">parallel</text>
</svg>