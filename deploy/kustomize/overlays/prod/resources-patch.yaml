apiVersion: apps/v1
kind: Deployment
metadata: { name: orderflow-order }
spec:
  template:
    spec:
      containers:
        - name: order
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
