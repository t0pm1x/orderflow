# Stand-in for the helm-template-rendered `all-services.yaml` so the
# kustomize base renders without requiring helm on the controller's
# PATH. The shape MUST match what `helm template orderflow-$svc` would
# render — the overlays' strategic-merge patches assume name
# `orderflow-$svc` per service, an `app.kubernetes.io/name`
# selector, and a `containers[].name` equal to the service.
#
# Regenerate via the procedure in deploy/kustomize/README.md when
# the upstream Helm values change in a way that affects rendered
# shape (image, port, env).
#
# Last synced: 2026-08-20 (v1.2 final-validation pass — K8S-5/6/7/12/13 fixes).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-order
  labels:
    app.kubernetes.io/name: orderflow-order
    app.kubernetes.io/instance: orderflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orderflow-order
      app.kubernetes.io/instance: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderflow-order
        app.kubernetes.io/instance: orderflow
    spec:
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: orderflow-order
          image: ghcr.io/t0pm1x/orderflow-order:v1.1.7
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 65532
            runAsGroup: 65532
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: ""
            - name: KAFKA_BROKERS
              value: ""
            - name: REDIS_URL
              value: ""
            - name: HTTP_ADDR
              value: ":8081"
            - name: OTEL_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector:4317"
            - name: LOG_LEVEL
              value: "info"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
