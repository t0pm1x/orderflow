global:
  scrape_interval: 15s

# Service ports must match the binaries' default HTTP_ADDR env (or
# the value override) AND the docker-compose host port mapping.
# order=8081, payment=8082, inventory=8083, saga=8084, web=8085.
# Pre-v1.2 the targets were off-by-one (8080..8083) so every scrape
# missed the actual metrics endpoints; the new
# outbox_bump_attempts_failures_total counter (NEW-P2-2) and the
# outbox_pending_events / outbox_failed_events gauges (OBS-9) were
# invisible to operators.
scrape_configs:
  - job_name: order-service
    static_configs:
      - targets: ['host.docker.internal:8081']
  - job_name: payment-service
    static_configs:
      - targets: ['host.docker.internal:8082']
  - job_name: inventory-service
    static_configs:
      - targets: ['host.docker.internal:8083']
  - job_name: saga-service
    static_configs:
      - targets: ['host.docker.internal:8084']
  # Web service (port 8085) is intentionally not scraped: it does
  # not expose a /metrics endpoint. Grep for promhttp in
  # services/web/ returns zero hits. Adding a scrape job here would
  # permanently report up{} = 0 with every 15s scrape returning
  # 404. When web gains request-level metrics the job can come
  # back.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']