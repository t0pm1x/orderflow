version: '3.8'
services:
  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: order_order
    ports:
      - "5432:5432"
    volumes:
      - pg_order_data:/var/lib/postgresql/data
      - ./postgres/init-order.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../services/order/migrations:/docker-entrypoint-initdb.d/migrations/order:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: payment_payment
    ports:
      - "5433:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql/data
      - ./postgres/init-payment.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../services/payment/migrations:/docker-entrypoint-initdb.d/migrations/payment:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: inventory_inventory
    ports:
      - "5434:5432"
    volumes:
      - pg_inventory_data:/var/lib/postgresql/data
      - ./postgres/init-inventory.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../services/inventory/migrations:/docker-entrypoint-initdb.d/migrations/inventory:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --mode=dev-container
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy -X brokers=redpanda:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - prometheus
      - tempo

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards

  # web depends on order/payment/inventory — provide those service blocks in
  # your extended compose file, or run them via
  # 'make run-{order,payment,inventory}' alongside the web container.
  # (Those service definitions are out of scope for this PR: they live in
  # cmd/{order,payment,inventory}/Dockerfile and their own compose fragments.)
  web:
    build:
      context: ..
      dockerfile: services/web/Dockerfile
    container_name: orderflow-web
    ports:
      - "8085:8083"
    environment:
      ORDER_URL: http://order:8081
      PAYMENT_URL: http://payment:8082
      INVENTORY_URL: http://inventory:8083
      KAFKA_BROKERS: redpanda:9092
      HTTP_ADDR: ":8083"
    restart: unless-stopped

volumes:
  pg_order_data:
  pg_payment_data:
  pg_inventory_data:
  redis_data:
  grafana_data: