version: '3.8'
services:
  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: order_order
    ports:
      - "5432:5432"
    volumes:
      - pg_order_data:/var/lib/postgresql/data
      - ./postgres/init-order.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../services/order/migrations:/docker-entrypoint-initdb.d/migrations/order:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: payment_payment
    ports:
      - "5433:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql/data
      - ./postgres/init-payment.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../services/payment/migrations:/docker-entrypoint-initdb.d/migrations/payment:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: inventory_inventory
    ports:
      - "5434:5432"
    volumes:
      - pg_inventory_data:/var/lib/postgresql/data
      - ./postgres/init-inventory.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../services/inventory/migrations:/docker-entrypoint-initdb.d/migrations/inventory:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      # Advertise the in-network DNS name so other services in the
      # docker compose network reach the broker by hostname. The
      # kafka-init container (and the other services in this compose
      # file) bootstrap via `KAFKA_BROKERS=redpanda:9092`. Host-side
      # franz-go clients (scripts/run.ps1) bootstrap via the
      # `127.0.0.1:9092` published-port path; for a single-broker
      # setup franz-go's bootstrap connection succeeds even when the
      # metadata-fetched broker address is the in-network name, because
      # all reads/writes go through the original bootstrap broker
      # connection.
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --mode=dev-container
    ports:
      - "9092:9092"
      - "9644:9644"
    # audit NEW-P0-4: redpanda now uses a named volume so the
    # broker's data dir survives container restart. Pre-fix the
    # broker kept state in the container's writable layer; a
    # `docker compose restart redpanda` (or `docker kill` followed
    # by `docker start`) wiped every topic, every offset, every
    # SENT marker — the saga's consumer-group join then found
    # nothing and the chain stalled because every outbox row was
    # SENT (the producer's ProduceSync-ACK'd before the kill) but
    # no consumer ever read the events. With the named volume the
    # broker recovers its state across restarts and the chaos
    # test's recovery assertion holds. Operators can wipe the
    # volume deliberately via `docker compose down -v`.
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy -X brokers=127.0.0.1:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - prometheus
      - tempo

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"

  grafana-secret-init:
    # audit K8S-4 / SEC-2: generates the Grafana admin password
    # on first `docker compose up` and stores it in a shared
    # named volume. The init container exits 0 once the file
    # exists; subsequent boots are no-ops (the file is already
    # there). Operators can read it once via
    # `docker compose run --rm grafana-secret-init cat /shared/grafana_admin_password`
    # and rotate it by deleting the `grafana_secret` volume.
    image: alpine:3.19
    command:
      - sh
      - -c
      - |
        if [ ! -s /shared/grafana_admin_password ]; then
          apk add --no-cache openssl >/dev/null 2>&1 || true
          openssl rand -hex 24 > /shared/grafana_admin_password
          echo "Grafana admin password generated at /shared/grafana_admin_password"
        else
          echo "Grafana admin password already exists; not regenerating"
        fi
        cat /shared/grafana_admin_password
    volumes:
      - grafana_secret:/shared
    restart: "no"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      grafana-secret-init:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /shared/grafana_admin_password
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_secret:/shared:ro
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards

  # ─── backend services (audit COMPOSE-MISSING-DEPS) ─────────────
  #
  # The four Go service binaries build per-cmd/<svc>/Dockerfile and
  # connect to the upstream infra (postgres-<svc>, redpanda) via the
  # in-network DNS names. HTTP_ADDRs are bound to the in-container
  # addresses; host ports are mapped below for local curl / smoke
  # scripts. Each binary is distroless and runs as nonroot.
  #
  # Kafka broker reachability: redpanda advertises 127.0.0.1:9092
  # (host-reachable) but container-side clients can't dial 127.0.0.1
  # (their own loopback). Docker Desktop provides
  # `host.docker.internal` as a host-reachable alias inside every
  # container; the broker also accepts connections on this alias
  # because the host publishes 9092:9092 to the host's 0.0.0.0.
  # We set KAFKA_BROKERS=host.docker.internal:9092 so the in-network
  # franz-go client reaches the broker via the host's loopback,
  # where the broker is actually listening and advertising.
  order:
    build:
      context: ..
      dockerfile: cmd/order/Dockerfile
    image: orderflow/order:latest
    container_name: orderflow-order
    depends_on:
      postgres-order:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orderflow:orderflow@postgres-order:5432/order_order?sslmode=disable
      KAFKA_BROKERS: host.docker.internal:9092
      HTTP_ADDR: ":8081"
      OTEL_EXPORTER: stdout
    ports:
      - "8081:8081"
    restart: unless-stopped

  payment:
    build:
      context: ..
      dockerfile: cmd/payment/Dockerfile
    image: orderflow/payment:latest
    container_name: orderflow-payment
    depends_on:
      postgres-payment:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orderflow:orderflow@postgres-payment:5432/payment_payment?sslmode=disable
      KAFKA_BROKERS: host.docker.internal:9092
      REDIS_URL: redis://redis:6379
      HTTP_ADDR: ":8082"
      OTEL_EXPORTER: stdout
    ports:
      - "8082:8082"
    restart: unless-stopped

  inventory:
    build:
      context: ..
      dockerfile: cmd/inventory/Dockerfile
    image: orderflow/inventory:latest
    container_name: orderflow-inventory
    depends_on:
      postgres-inventory:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orderflow:orderflow@postgres-inventory:5432/inventory_inventory?sslmode=disable
      KAFKA_BROKERS: host.docker.internal:9092
      REDIS_URL: redis://redis:6379
      HTTP_ADDR: ":8083"
      OTEL_EXPORTER: stdout
    ports:
      - "8083:8083"
    restart: unless-stopped

  saga:
    build:
      context: ..
      dockerfile: cmd/saga/Dockerfile
    image: orderflow/saga:latest
    container_name: orderflow-saga
    depends_on:
      postgres-order:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      # saga shares the order DB (matches scripts/run.ps1 + tests/harness)
      DATABASE_URL: postgres://orderflow:orderflow@postgres-order:5432/order_order?sslmode=disable
      KAFKA_BROKERS: host.docker.internal:9092
      HTTP_ADDR: ":8084"
      OTEL_EXPORTER: stdout
    ports:
      - "8084:8084"
    restart: unless-stopped

  # ─── web playground (BFF for the four backend services) ───────
  web:
    build:
      context: ..
      dockerfile: services/web/Dockerfile
    container_name: orderflow-web
    depends_on:
      order:
        condition: service_started
      payment:
        condition: service_started
      inventory:
        condition: service_started
    environment:
      ORDER_URL: http://order:8081
      PAYMENT_URL: http://payment:8082
      INVENTORY_URL: http://inventory:8083
      KAFKA_BROKERS: host.docker.internal:9092
      # PORT-CONFLICT fix: web's in-container port is now :8085 by
      # default so it doesn't collide with inventory's :8083. The
      # host-side mapping is also :8085:8085 (was :8085:8083 which
      # would have worked because Docker maps the container's :8083
      # to the host's :8085, but the comment was confusing — the
      # mapping now matches the container's default).
      HTTP_ADDR: ":8085"
      OTEL_EXPORTER: stdout
    ports:
      - "8085:8085"
    restart: unless-stopped

volumes:
  pg_order_data:
  pg_payment_data:
  pg_inventory_data:
  redis_data:
  grafana_data:
  grafana_secret:
  # audit NEW-P0-4: persistent volume for the redpanda data dir so
  # broker state survives container restart. See the comment on
  # the redpanda service for the full rationale.
  redpanda_data: