image:
  repository: ghcr.io/t0pm1x/orderflow-saga
  tag: "0.2.0"
  pullPolicy: IfNotPresent
replicas: 2
service:
  type: ClusterIP
  port: 80
  targetPort: 8084
env:
  HTTP_ADDR: ":8084"
  OTEL_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  LOG_LEVEL: "info"
# Connection strings come from a Secret. See secret.create / secret.existingSecret
# and the values-override.yaml.example file.
secret:
  create: true
  existingSecret: ""
  data: {}
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
  startup:
    path: /healthz
    failureThreshold: 30
    periodSeconds: 5
lifecycle:
  preStop:
    sleepSeconds: 5
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
serviceAccount:
  create: true
  name: ""

# Horizontal Pod Autoscaler. Pre-existing in deployment.yaml template;
# defaulting so the chart renders without a values override. Set
# `autoscaling.enabled: true` and supply min/max replicas + target metrics
# to wire up HPA. When enabled, `replicas` is ignored.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70