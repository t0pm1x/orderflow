apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orderflow-saga.fullname" . }}
  labels:
    {{- include "orderflow-saga.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  OTEL_EXPORTER: {{ .Values.env.OTEL_EXPORTER | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
  HTTP_ADDR: {{ .Values.env.HTTP_ADDR | quote }}