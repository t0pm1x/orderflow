image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

replicas: 1

storage:
  size: 8Gi
  accessModes:
    - ReadWriteOnce

auth:
  username: orderflow
  # Password is intentionally NOT defaulted. Empty value forces operators to
  # either populate it via a values override or via secret.create/existingSecret.
  # See templates/secret.yaml and templates/statefulset.yaml.
  password: ""
  database: orderflow

# Chart-managed Secret for the postgres credentials. Operators may instead
# point `existingSecret` at a Secret they provisioned themselves.
secret:
  create: true
  existingSecret: ""

databases:
  - name: order_order
    owner: orderflow
  - name: payment_payment
    owner: orderflow
  - name: inventory_inventory
    owner: orderflow

service:
  port: 5432

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

