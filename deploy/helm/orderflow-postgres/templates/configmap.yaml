apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orderflow-postgres.fullname" . }}-init
  labels:
    {{- include "orderflow-postgres.labels" . | nindent 4 }}
data:
  01-create-dbs.sh: |
    #!/bin/bash
    set -e
    {{- range .Values.databases }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE {{ .name }} OWNER {{ .owner }};"
    {{- end }}
  02-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
