{{/*
Secret for the PostgreSQL credentials. The chart-managed Secret is
created only when `secret.create` is true and `secret.existingSecret`
is empty. Operators may instead point `secret.existingSecret` at a
Secret they provisioned.

To migrate an existing release from the old inlined `auth.password`,
render the chart with the old values, extract the inlined password
into a Secret, and re-render with `secret.existingSecret=<name>`.
*/}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orderflow-postgres.fullname" . }}
  labels:
    {{- include "orderflow-postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
{{- end }}
