apiVersion: v1
kind: Service
metadata:
  name: {{ include "orderflow-postgres.fullname" . }}
  labels:
    {{- include "orderflow-postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "orderflow-postgres.selectorLabels" . | nindent 4 }}
