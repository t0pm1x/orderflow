{{/*
Secret for the optional KAFKA_BROKERS value. The chart ships with
an empty default — operators populate it via a values override
file (see values-override.yaml.example) or by referencing an
externally-managed Secret with
`--set secret.existingSecret=my-secret`.
*/}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orderflow-web.fullname" . }}
  labels:
    {{- include "orderflow-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.data }}
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- else }}
  KAFKA_BROKERS: {{ .Values.env.KAFKA_BROKERS | quote }}
  {{- end }}
{{- end }}
