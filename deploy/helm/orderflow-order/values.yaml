image:
  repository: ghcr.io/t0pm1x/orderflow-order
  tag: "v1.1.7"
  pullPolicy: IfNotPresent
replicas: 2
service:
  type: ClusterIP
  port: 80
  targetPort: 8081
env:
  HTTP_ADDR: ":8081"
  OTEL_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  LOG_LEVEL: "info"
# Connection strings come from a Secret. See secret.create / secret.existingSecret
# and the values-override.yaml.example file.
secret:
  create: true
  existingSecret: ""
  data: {}
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
  # startupProbe gives OTel init + DB pool warmup up to 150s
  # (failureThreshold * periodSeconds) before kubelet starts the
  # liveness probe countdown. Without this, cold starts can fail
  # liveness at the 5s initialDelaySeconds and SIGKILL pods that
  # are still warming up.
  startup:
    path: /healthz
    failureThreshold: 30
    periodSeconds: 5
# preStop hook gives the kubelet 5s to drain in-flight requests
# and commit outbox offsets before the SIGTERM is delivered.
lifecycle:
  preStop:
    sleepSeconds: 5
# Distroless:nonroot image ships UID/GID 65532. Pin both so the
# kubelet doesn't pick a different value across schedulers.
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
serviceAccount:
  create: true
  name: ""
