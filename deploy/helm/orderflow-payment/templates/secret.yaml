{{/*
Secret for the Payment Service connection settings.
The chart ships with empty string defaults. Operators must populate
these via a values override file (see values-override.yaml.example)
or by referencing an externally-managed Secret with
`--set secret.existingSecret=my-secret`.
*/}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orderflow-payment.fullname" . }}
  labels:
    {{- include "orderflow-payment.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.data }}
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- else }}
  DATABASE_URL: ""
  KAFKA_BROKERS: ""
  REDIS_URL: ""
  {{- end }}
{{- end }}
