apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orderflow-payment.fullname" . }}
  labels:
    {{- include "orderflow-payment.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "orderflow-payment.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orderflow-payment.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orderflow-payment.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: KAFKA_BROKER
              value: {{ .Values.env.KAFKA_BROKER | quote }}
            - name: HTTP_ADDR
              value: {{ .Values.env.HTTP_ADDR | quote }}
            - name: OTEL_EXPORTER
              value: {{ .Values.env.OTEL_EXPORTER | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "orderflow-payment.fullname" . }}
                  key: LOG_LEVEL
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
