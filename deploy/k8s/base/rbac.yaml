apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderflow
  namespace: orderflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orderflow
  namespace: orderflow
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orderflow
  namespace: orderflow
subjects:
- kind: ServiceAccount
  name: orderflow
  namespace: orderflow
roleRef:
  kind: Role
  name: orderflow
  apiGroup: rbac.authorization.k8s.io