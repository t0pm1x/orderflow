name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: |
            pkg/consumer/go.sum
            pkg/outbox/go.sum
            pkg/platform/go.sum
            pkg/platform/instrumentation/kafkaprop/go.sum
            services/order/go.sum
            services/payment/go.sum
            services/inventory/go.sum
            services/saga/go.sum
            services/web/go.sum
            cmd/order/go.sum
            cmd/payment/go.sum
            cmd/inventory/go.sum
            cmd/saga/go.sum
            cmd/web/go.sum

      - name: Test
        run: make test

      - name: Build
        run: make build

  detect-modules:
    name: detect-modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: |
            pkg/consumer/go.sum
            pkg/outbox/go.sum
            pkg/platform/go.sum
            pkg/platform/instrumentation/kafkaprop/go.sum
            services/order/go.sum
            services/payment/go.sum
            services/inventory/go.sum
            services/saga/go.sum
            services/web/go.sum
            cmd/order/go.sum
            cmd/payment/go.sum
            cmd/inventory/go.sum
            cmd/saga/go.sum
            cmd/web/go.sum

      - id: set-modules
        run: |
          modules=$(go list -m -f '{{.Dir}}' | jq -R -s -c 'split("\n") | map(select(. != "" and . != "./tests"))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  lint:
    name: lint (${{ matrix.module }})
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # detect-modules already filters out ./tests (test harness
        # uses testcontainers-go whose transitive deps are flaky
        # via the Go module proxy and would trigger spurious
        # typecheck failures inside OTHER modules when
        # golangci-lint resolves the full workspace graph).
        # tests/ is exercised by the e2e job below.
        module: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: |
            pkg/consumer/go.sum
            pkg/outbox/go.sum
            pkg/platform/go.sum
            pkg/platform/instrumentation/kafkaprop/go.sum
            services/order/go.sum
            services/payment/go.sum
            services/inventory/go.sum
            services/saga/go.sum
            services/web/go.sum
            cmd/order/go.sum
            cmd/payment/go.sum
            cmd/inventory/go.sum
            cmd/saga/go.sum
            cmd/web/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}
          args: --path-mode=abs --timeout=5m

  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: |
            pkg/consumer/go.sum
            pkg/outbox/go.sum
            pkg/platform/go.sum
            pkg/platform/instrumentation/kafkaprop/go.sum
            services/order/go.sum
            services/payment/go.sum
            services/inventory/go.sum
            services/saga/go.sum
            services/web/go.sum
            cmd/order/go.sum
            cmd/payment/go.sum
            cmd/inventory/go.sum
            cmd/saga/go.sum
            cmd/web/go.sum

      - name: Build service binaries
        run: |
          mkdir -p bin
          go build -o bin/order ./cmd/order
          go build -o bin/payment ./cmd/payment
          go build -o bin/inventory ./cmd/inventory
          go build -o bin/saga ./cmd/saga

      # Load test is intentionally excluded from CI: requires k6 installation
      # and is heavy. Run manually via `make load` from tests/load/.
      - name: E2E happy path
        run: go test ./tests/e2e/... -run TestE2E_OrderReachesConfirmed -timeout 5m -v

      - name: E2E compensation
        run: go test ./tests/e2e/... -run TestE2E_Compensation_PaymentDeclined_CancelsOrder -timeout 5m -v

      - name: Chaos test
        run: go test ./tests/chaos/... -timeout 10m -v

      # tests/harness.StartService redirects each spawned service's
      # stdout + stderr to tests/logs/<svc>.log (one file per
      # service). The log file is closed by the harness's stop
      # callback, which Go's defer machinery runs even on t.Fatal
      # (Go's runtime.Goexit). Uploading these unconditionally on
      # every E2E run gives the operator full diagnostic on a chain
      # stall without grepping through CI service output.
      - name: Upload E2E service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-service-logs
          path: tests/logs/
          if-no-files-found: ignore
          retention-days: 14

  vuln-scan:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: |
            pkg/consumer/go.sum
            pkg/outbox/go.sum
            pkg/platform/go.sum
            pkg/platform/instrumentation/kafkaprop/go.sum
            services/order/go.sum
            services/payment/go.sum
            services/inventory/go.sum
            services/saga/go.sum
            services/web/go.sum
            cmd/order/go.sum
            cmd/payment/go.sum
            cmd/inventory/go.sum
            cmd/saga/go.sum
            cmd/web/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # govulncheck scans every workspace module for known CVEs in
      # the dependency graph. The check is non-blocking by design
      # (continue-on-error: true) so an upstream CVE doesn't break
      # CI; the workflow still surfaces the finding for triage.
      - name: Run govulncheck against all modules
        continue-on-error: true
        run: |
          for m in pkg/consumer pkg/outbox pkg/platform pkg/platform/instrumentation/kafkaprop \
                   services/order services/payment services/inventory services/saga services/web \
                   cmd/order cmd/payment cmd/inventory cmd/saga cmd/web; do
            echo "==> scanning $m"
            (cd "$m" && govulncheck ./...) || echo "::warning::govulncheck found issues in $m"
          done
