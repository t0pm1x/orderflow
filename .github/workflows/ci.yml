name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.0.2
          args: --timeout=5m

      - name: Test
        run: make test

      - name: Build
        run: make build

  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build service binaries
        run: |
          mkdir -p bin
          go build -o bin/order ./cmd/order
          go build -o bin/payment ./cmd/payment
          go build -o bin/inventory ./cmd/inventory
          go build -o bin/saga ./cmd/saga

      # Load test is intentionally excluded from CI: requires k6 installation
      # and is heavy. Run manually via `make load` from tests/load/.
      - name: E2E happy path
        run: go test ./tests/e2e/... -run TestE2E_HappyPath -timeout 5m -v

      - name: E2E compensation
        run: go test ./tests/e2e/... -run TestE2E_Compensation -timeout 5m -v

      - name: Chaos test
        run: go test ./tests/chaos/... -timeout 10m -v
