name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test
        run: make test

      - name: Build
        run: make build

  detect-modules:
    name: detect-modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - id: set-modules
        run: |
          modules=$(go list -m -f '{{.Dir}}' | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  lint:
    name: lint (${{ matrix.module }})
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: ${{ matrix.module }}
          args: --path-mode=abs --timeout=5m

  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build service binaries
        run: |
          mkdir -p bin
          go build -o bin/order ./cmd/order
          go build -o bin/payment ./cmd/payment
          go build -o bin/inventory ./cmd/inventory
          go build -o bin/saga ./cmd/saga

      # Load test is intentionally excluded from CI: requires k6 installation
      # and is heavy. Run manually via `make load` from tests/load/.
      - name: E2E happy path
        run: go test ./tests/e2e/... -run TestE2E_HappyPath -timeout 5m -v

      - name: E2E compensation
        run: go test ./tests/e2e/... -run TestE2E_Compensation -timeout 5m -v

      - name: Chaos test
        run: go test ./tests/chaos/... -timeout 10m -v
